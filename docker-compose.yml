# Local Postgres for development: docker compose up -d
# Matches DATABASE_URL in server/.env.example. If Postgres is already installed
# on this machine and using port 5432, stop it or change the left-hand port.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: material_calc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
